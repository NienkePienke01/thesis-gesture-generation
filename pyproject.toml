[project]
name = "mpi-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8.20"
dependencies = [
    "scikit-learn>=1.3.0",
    "cffi>=1.17.1",
    "einops>=0.8.1",
    "gradio>=4.44.1",
    "ipykernel>=6.29.5",
    "librosa>=0.11.0",
    "lmdb==1.4.1",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "open3d>=0.10.0,<0.13.0",
    "opencv-python>=4.13.0.92",
    "pandas>=2.0.3",
    "pyarrow>=17.0.0",
    "pyrender>=0.1.45",
    "smplx>=0.1.28",
    "torch<2.5",
    "transformers>=4.46.3",
    "wget>=3.2",
    "wandb>=0.16.0,<0.19.0",
    "ffmpeg-python>=0.2.0",
    "static-ffmpeg>=3.0",
]
[tool.setuptools.packages.find]
include = ["data_processing*"]
exclude = ["cache*", "data*", "configs*", "visualisation*"]
[tool.uv]
config-settings = { lmdb = "--build-from-source" }
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
